{% extends "base.html" %}
{% block content %}
<div class="chips">
  <a class="{% if not active %}on{% endif %}" href="{% url 'home' %}">All</a>
  {% for c in categories %}<a class="{% if active == c.slug %}on{% endif %}" href="?category={{ c.slug }}">{{ c.name }}</a>{% endfor %}
</div>
<div class="grid">
  {% for p in products %}
  <article class="card">
    <a href="{{ p.get_absolute_url }}"><img src="{{ p.image_url }}" alt="{{ p.name }}"></a>
    <h3><a href="{{ p.get_absolute_url }}">{{ p.name }}</a></h3>
    <p class="price">KSh {{ p.price|floatformat:0 }}</p>
    <form method="post" action="{% url 'cart_add' p.pk %}">{% csrf_token %}<input type="hidden" name="next" value="{% url 'home' %}"><button {% if not p.stock %}disabled{% endif %}>{% if p.stock %}Add to cart{% else %}Sold out{% endif %}</button></form>
  </article>
  {% empty %}<p>No products found. Run <code>python manage.py seed</code>.</p>{% endfor %}
</div>
{% endblock %}
