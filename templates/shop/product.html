{% extends "base.html" %}
{% block title %}{{ product.name }} — Quartico{% endblock %}
{% block content %}
<div class="detail">
  <img src="{{ product.image_url }}" alt="{{ product.name }}">
  <div>
    <h1>{{ product.name }}</h1>
    <p class="muted">{{ product.category }}</p>
    <p class="price big">KSh {{ product.price|floatformat:0 }}</p>
    <p>{{ product.description }}</p>
    <p class="muted">{{ product.stock }} in stock</p>
    <form method="post" action="{% url 'cart_add' product.pk %}">{% csrf_token %}
      <input type="number" name="qty" value="1" min="1" max="20">
      <button {% if not product.stock %}disabled{% endif %}>Add to cart</button>
    </form>
  </div>
</div>
{% endblock %}
